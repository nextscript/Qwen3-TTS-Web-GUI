name: Python CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black==24.8.0 isort

      - name: Run linter
        shell: bash
        run: |
          flake8 --max-line-length=120 --ignore=E501,W503 .
          black --check --diff --line-ending lf .

      - name: Check import sorting
        shell: bash
        run: |
          isort --check-only --profile black .

  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check syntax
        shell: bash
        run: |
          python -m py_compile app.py
          python -m py_compile launcher.py
