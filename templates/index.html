<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen3-TTS Web GUI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-mic-fill text-primary me-2"></i>Qwen3-TTS
            </a>
            <span class="navbar-text text-muted d-none d-sm-inline">
                {{ current_model.name }}
            </span>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                <div class="w-100">

                <!-- Main Card -->
                <div class="card border-secondary shadow-sm">
                    <div class="card-header bg-dark bg-gradient border-secondary">
                        <h5 class="mb-0"><i class="bi bi-text-paragraph me-2"></i>Enter Text</h5>
                    </div>
                    <div class="card-body">
                        <form id="tts-form">
                            <!-- Textarea -->
                            <div class="mb-3">
                                <label for="text-input" class="form-label fw-semibold">
                                    <i class="bi bi-fonts me-1"></i>Speech Text
                                </label>
                                <textarea
                                    class="form-control form-control-lg"
                                    id="text-input"
                                    rows="5"
                                    placeholder="Enter the text you want to synthesize here..."
                                ></textarea>
                                </div>
                            </div>

                            <!-- Instruct (optional) -->
                            <div class="mb-3">
                                <label for="instruct-input" class="form-label fw-semibold">
                                    <i class="bi bi-chat-text me-1"></i>Instruction (optional)
                                </label>
                                <textarea
                                    class="form-control form-control-lg"
                                    id="instruct-input"
                                    rows="5"
                                    placeholder="e.g. 'speak in a deep voice' or 'whisper'"
                                ></textarea>
                            </div>

                            <!-- Speaker Selection -->
                            <div class="mb-3">
                                <label for="speaker-select" class="form-label fw-semibold">
                                    <i class="bi bi-person-badge me-1"></i>Speaker
                                </label>
                                <select class="form-select form-select-lg" id="speaker-select">
                                    {% for speaker_id, speaker_desc in speakers.items() %}
                                    <option value="{{ speaker_id }}" data-desc="{{ speaker_desc }}">
                                        {{ speaker_id }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- Language -->
                            <div class="mb-3">
                                <label for="language-select" class="form-label fw-semibold">
                                    <i class="bi bi-globe me-1"></i>Language
                                </label>
                                <select class="form-select form-select-lg" id="language-select">
                                    {% for lang in languages %}
                                    <option value="{{ lang }}" {% if lang == 'Auto' %}selected{% endif %}>
                                        {{ lang }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- Buttons -->
                            <div class="d-flex gap-2 flex-wrap">
                                <button type="button" class="btn btn-lg btn-primary flex-grow-1" id="btn-generate">
                                    <i class="bi bi-play-fill me-2"></i>
                                    <span id="btn-generate-text">Generate</span>
                                </button>
                                <button type="button" class="btn btn-lg btn-success d-none" id="btn-download">
                                    <i class="bi bi-download me-2"></i>Download (.wav)
                                </button>
                                <button type="button" class="btn btn-lg btn-outline-secondary d-none" id="btn-stop">
                                    <i class="bi bi-stop-fill"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- History -->
                <div class="card border-secondary shadow-sm mt-4 d-none" id="history-card">
                    <div class="card-header bg-dark bg-gradient border-secondary d-flex justify-content-between align-items-center">
                        <h6 class="mb-0"><i class="bi bi-clock-history me-2"></i>History</h6>
                        <div class="d-flex gap-2">
                            <small class="text-muted" id="output-size">0 MB</small>
                            <button type="button" class="btn btn-sm btn-outline-danger" id="btn-clear-history">
                                <i class="bi bi-trash me-1"></i>Clear
                            </button>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="list-group list-group-flush" id="history-list" style="max-height: 400px; overflow-y: auto;">
                            <div class="text-center py-4" id="history-empty-state">
                                <i class="bi bi-clock-history text-muted" style="font-size: 2rem;"></i>
                                <p class="text-muted mt-2 mb-0">No entries yet</p>
                                <small class="text-muted">Generate audio to see entries here</small>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Audio Player -->
                <div class="card border-secondary shadow-sm mt-4 d-none" id="audio-card">
                    <div class="card-header bg-dark bg-gradient border-secondary">
                        <h6 class="mb-0"><i class="bi bi-soundwave me-2"></i>Output</h6>
                    </div>
                    <div class="card-body">
                        <audio id="audio-player" controls class="w-100 mb-3"></audio>
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted" id="audio-info"></small>
                            <button type="button" class="btn btn-sm btn-outline-info" id="btn-copy-link">
                                <i class="bi bi-link-45deg me-1"></i>Copy Link
                            </button>
                        </div>
                    </div>
                </div>
                </div>
            </div>
        </div>
    </div>



    <!-- Footer -->
    <footer class="text-center py-3 mt-4 border-top border-secondary">
        <small class="text-muted">
            Powered by <a href="https://huggingface.co/Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice" target="_blank" class="text-primary">Qwen3-TTS</a>
        </small>
    </footer>

    <!-- Loading Overlay -->
    <div class="loading-overlay d-none" id="loading-overlay">
        <div class="loading-spinner">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-3 mb-0 fw-semibold" id="loading-status-text">Generating audio...</p>
            <small class="text-muted" id="loading-detail">This may take a few seconds depending on text length</small>
            
            <!-- Progress Bar -->
            <div class="progress mt-3" id="loading-progress-container" style="height: 6px;">
                <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" role="progressbar" id="loading-progress-bar" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
